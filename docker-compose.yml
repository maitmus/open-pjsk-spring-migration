services:
  sekai-router:
    build: .
    container_name: sekai-router
    restart: unless-stopped
    # SIGTERM 후 강제 kill까지 30s 대기 — 진행 중 발화/LLM호출/머슴게시가 graceful하게 끝나도록
    # (ChannelExecutors @PreDestroy의 awaitTermination 20s보다 길게)
    stop_grace_period: 30s
    env_file: .env
    environment:
      - PERSONA_DIR=/app/identities
      # 타임존 KST 고정 — logback timestamp, LocalDateTime, ZonedDateTime 등 JVM 기본 시간 모두 KST
      - TZ=Asia/Seoul
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Seoul
    volumes:
      - /home/maitmus/.openclaw/workspace/identities:/app/identities:ro
      # USER.md는 SystemPromptBuilder가 PERSONA_DIR의 부모 디렉토리에서 찾음 (/app/USER.md)
      - /home/maitmus/.openclaw/workspace/USER.md:/app/USER.md:ro
      - /home/maitmus/sekai-router-logs:/app/logs
      # 머슴 state 파일 (read-write) + 마커 디렉터리
      - /home/maitmus/.openclaw/workspace-cron-worker/mersoom-state.json:/app/mersoom-state.json:rw
      # 네네 머슴 시민 전용 state (read-write) — 에무와 독립된 평판 그래프
      - /home/maitmus/.openclaw/workspace-cron-worker/nene-mersoom-state.json:/app/nene-mersoom-state.json:rw
      - /home/maitmus/sekai-router-mersoom-flags:/app/mersoom-flags
      # 아레나 side 락 state (read-write)
      - /home/maitmus/.openclaw/workspace-cron-worker/arena-state.json:/app/arena-state.json:rw
      # 대시보드 활동 피드 (read-write) — 댓글·글·발화 이벤트 영속, 재시작에도 안 비워짐
      - /home/maitmus/.openclaw/workspace-cron-worker/activity-feed.json:/app/activity-feed.json:rw
    # No ports needed — Discord bot with no embedded web server

  # 운영 대시보드 (read-only 사이드카). 봇 앱과 독립 — state/로그/arena API만 읽음.
  dashboard:
    build: ./dashboard
    container_name: sekai-dashboard
    restart: unless-stopped
    ports:
      # localhost에만 바인딩 — LAN/공인 직접 노출 차단. 외부 접근은 Tailscale(tailscale serve)이 프록시.
      - "127.0.0.1:8088:8088"
    volumes:
      - /home/maitmus/.openclaw/workspace-cron-worker/mersoom-state.json:/data/mersoom-state.json:ro
      - /home/maitmus/.openclaw/workspace-cron-worker/nene-mersoom-state.json:/data/nene-mersoom-state.json:ro
      - /home/maitmus/.openclaw/workspace-cron-worker/arena-state.json:/data/arena-state.json:ro
      - /home/maitmus/.openclaw/workspace-cron-worker/activity-feed.json:/data/activity-feed.json:ro
      - /home/maitmus/sekai-router-logs:/logs:ro
