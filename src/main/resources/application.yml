spring:
  application:
    name: open-pjsk-spring-migration
  main:
    web-application-type: none

logging:
  level:
    root: INFO
    com.maitmus.sekairouter: DEBUG
    net.dv8tion.jda: WARN
  # 컨테이너 down/up 사이클에 영속화하기 위해 파일 로깅 활성. /app/logs는 docker-compose에서 호스트 볼륨 마운트.
  # 호스트 경로가 없으면 비활성 (file appender가 디렉토리 없으면 그냥 stdout만 사용)
  file:
    name: /app/logs/sekai-router.log
  logback:
    rollingpolicy:
      max-history: 14
      max-file-size: 100MB
      total-size-cap: 1GB

discord:
  router-token: ${DISCORD_ROUTER_TOKEN:}
  sekai-channel-id: ${SEKAI_CHANNEL_ID:}
  character-tokens:
    AIRI: ${DISCORD_AIRI_TOKEN:}
    EMU: ${DISCORD_EMU_TOKEN:}
    HARUKA: ${DISCORD_HARUKA_TOKEN:}
    MIKU: ${DISCORD_MIKU_TOKEN:}
    MINORI: ${DISCORD_MINORI_TOKEN:}
    NENE: ${DISCORD_NENE_TOKEN:}
    SHIZUKU: ${DISCORD_SHIZUKU_TOKEN:}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:5000}

persona:
  dir: ${PERSONA_DIR:/home/maitmus/.openclaw/workspace/identities}
  watch-interval-ms: 60000

heartbeat:
  enabled: ${HEARTBEAT_ENABLED:true}
  quiet-start-hour: ${HEARTBEAT_QUIET_START_HOUR:21}
  quiet-end-hour: ${HEARTBEAT_QUIET_END_HOUR:10}
  dialogue-probability: ${HEARTBEAT_DIALOGUE_PROB:0.5}
