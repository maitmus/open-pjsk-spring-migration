spring:
  application:
    name: open-pjsk-spring-migration
  main:
    web-application-type: none

logging:
  level:
    root: INFO
    com.maitmus.sekairouter: DEBUG
    net.dv8tion.jda: WARN
  # 컨테이너 down/up 사이클에 영속화하기 위해 파일 로깅 활성. /app/logs는 docker-compose에서 호스트 볼륨 마운트.
  # 호스트 경로가 없으면 비활성 (file appender가 디렉토리 없으면 그냥 stdout만 사용)
  file:
    name: /app/logs/sekai-router.log
  logback:
    rollingpolicy:
      max-history: 14
      max-file-size: 100MB
      total-size-cap: 1GB

discord:
  enabled: ${DISCORD_ENABLED:true}                        # false면 JDA 초기화 스킵(발화·리액티브 대화 둘 다 휴면일 때 부팅 취약점·유휴연결 제거)
  router-token: ${DISCORD_ROUTER_TOKEN:}
  sekai-channel-id: ${SEKAI_CHANNEL_ID:}
  character-tokens:
    AIRI: ${DISCORD_AIRI_TOKEN:}
    EMU: ${DISCORD_EMU_TOKEN:}
    HARUKA: ${DISCORD_HARUKA_TOKEN:}
    MIKU: ${DISCORD_MIKU_TOKEN:}
    MINORI: ${DISCORD_MINORI_TOKEN:}
    NENE: ${DISCORD_NENE_TOKEN:}
    SHIZUKU: ${DISCORD_SHIZUKU_TOKEN:}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:5000}

persona:
  dir: ${PERSONA_DIR:/home/maitmus/.openclaw/workspace/identities}
  watch-interval-ms: 60000

heartbeat:
  enabled: ${HEARTBEAT_ENABLED:true}
  quiet-start-hour: ${HEARTBEAT_QUIET_START_HOUR:20}   # 활성 종료 20시 (active 09:00–19:59)
  quiet-end-hour: ${HEARTBEAT_QUIET_END_HOUR:9}        # 활성 시작 09시
  dialogue-probability: ${HEARTBEAT_DIALOGUE_PROB:0.5}

# 공유 prefix 캐시(1h TTL) 아침 워밍: 08:30 아레나 발의가 캐시 WRITE(매일 첫 호출, cold) →
# 09:00 하트비트(크론 :00/:30)·09:15 머슴 댓글이 1h 안에 cache_read로 이어받아 하루종일 warm 유지.
# (날씨 캐스트 크론은 2026-06-15 폐지 — web_search 산발 회귀 + 캐시 워밍에 비필수)

# 머슴 자동 글/댓글 — 활성창 09–19로 정렬 (게이트 MersoomService.isActiveHour 9–19)
mersoom:
  enabled: ${MERSOOM_ENABLED:false}                      # 기본 false (마이그 검증 후 true)
  post-cron: ${MERSOOM_POST_CRON:0 30 10,13,16,19 * * *} # 10:30·13:30·16:30·19:30 KST (하루 4회, 3h 균등. 댓글 :15·네네 :00과 분 충돌 회피)
  comment-cron: ${MERSOOM_COMMENT_CRON:0 15 9-19 * * *}    # 매시 15분 09:15~19:15 (11회/일, 1h 간격)
  skills-sync-cron: ${MERSOOM_SKILLS_CRON:0 0 9 * * *}   # 매일 09:00 KST
  state-file: ${MERSOOM_STATE_FILE:/app/mersoom-state.json}
  skills-cache-path: ${MERSOOM_SKILLS_CACHE:/app/mersoom-flags/skills-cache.md}
  context-note-bytes-per-friend: 1024
  voted-post-ids-limit: 100
  pow-timeout-seconds: 30
  puzzle-timeout-seconds: 10
  api-rate-limit-sleep-ms: 1000
  api-base-url: https://mersoom.com/api
  skills-doc-url: https://www.mersoom.com/docs/skills.md
  auth:
    auth-id: ${MERSOOM_AUTH_ID:}
    password: ${MERSOOM_PASSWORD:}
  # 네네 머슴 시민 — 에무와 동급의 글/댓글 사회 시민(별도 계정·state·네네 페르소나).
  # cron은 에무와 엇갈리게: 댓글 매시 :45(에무 :15), 글 11:00/18:00(에무 10:30/17:30). 기본 비활성.
  nene:
    enabled: ${MERSOOM_NENE_ENABLED:false}
    post-cron: ${MERSOOM_NENE_POST_CRON:0 0 10,13,16,19 * * *} # 10:00·13:00·16:00·19:00 KST (하루 4회, 3h 균등. 에무 :30보다 30분 앞, 아레나 :30·댓글과 분 충돌 없음)
    comment-cron: ${MERSOOM_NENE_COMMENT_CRON:0 45 9-19 * * *} # 매시 45분 09:45~19:45 (11회/일)
    state-file: ${MERSOOM_NENE_STATE_FILE:/app/nene-mersoom-state.json}
    auth:
      auth-id: ${NENE_MERSOOM_AUTH_ID:}
      password: ${NENE_MERSOOM_PASSWORD:}
  # 자율 광고 — 글 크론마다 포인트 여유 있으면(버퍼 이상, 동시상한 미만) 캐릭터 한마디를 광고 배너로.
  # 취소 불가·노출 느림이라 '소진 대기' 대신 버퍼+상한으로 매 글 크론 갱신. 두 봇 각자 계정·포인트.
  ad:
    enabled: ${MERSOOM_AD_ENABLED:false}
    points-buffer: ${MERSOOM_AD_BUFFER:300}
    max-active: ${MERSOOM_AD_MAX_ACTIVE:5}
    points-per-ad: ${MERSOOM_AD_POINTS:100}

# 아레나 토론 — 에무(emu_wonder) 발의 + 쿠사나기 네네(nene_wonder) 토론
arena:
  enabled: ${ARENA_ENABLED:false}                        # 기본 false (빌드 검증 후 true)
  propose-cron: ${ARENA_PROPOSE_CRON:0 30 8 * * *}       # 08:30 KST (PROPOSE 00–09 창, 공유 캐시 prefix 워밍)
  propose-count: ${ARENA_PROPOSE_COUNT:0}                 # 발의 크론당 주제 수. 0=발의 비활성(2026-06-24, 채택률 0%라 발의 생략 — 토론/fight은 유지. 캐시 워밍은 09:00 하트비트가 이어받음). 1=1건, 2+는 '계정당 시간당 1발의'(429)로 2번째 막혀 1h+ 간격 크론 필요. 루프·회피 코드는 유지(옵션).
  fight-cron: ${ARENA_FIGHT_CRON:0 0,30 12-19 * * *}     # 12:00~19:30 30분 간격 (매너 20시 전 종료). 매 틱 prep이 캐시 워밍, 게이트로 실제 게시는 제한.
  api-base-url: ${ARENA_API_BASE:https://www.mersoom.com/api}
  state-file: ${ARENA_STATE_FILE:/app/arena-state.json}  # side 락(토픽별 입장 고정) 영속. 볼륨 마운트
  propose:                                               # 네네 계정으로 주제 발의 (발의·토론 모두 네네로 통일)
    auth-id: ${NENE_MERSOOM_AUTH_ID:}
    password: ${NENE_MERSOOM_PASSWORD:}
    nickname: 쿠사나기 네네
  fight:                                                 # 네네 계정으로 토론 참여 (풀네임)
    auth-id: ${NENE_MERSOOM_AUTH_ID:}
    password: ${NENE_MERSOOM_PASSWORD:}
    nickname: 쿠사나기 네네

# 대시보드 활동 피드 — 봇이 댓글·글·발화 이벤트를 구조화로 영속(대시보드가 ro로 읽음, 로그 역파싱 대체)
activity:
  feed-file: ${ACTIVITY_FEED_FILE:/app/activity-feed.json}
