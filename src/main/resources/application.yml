spring:
  application:
    name: open-pjsk-spring-migration
  main:
    web-application-type: none

logging:
  level:
    root: INFO
    com.maitmus.sekairouter: DEBUG
    net.dv8tion.jda: WARN
  # 컨테이너 down/up 사이클에 영속화하기 위해 파일 로깅 활성. /app/logs는 docker-compose에서 호스트 볼륨 마운트.
  # 호스트 경로가 없으면 비활성 (file appender가 디렉토리 없으면 그냥 stdout만 사용)
  file:
    name: /app/logs/sekai-router.log
  logback:
    rollingpolicy:
      max-history: 14
      max-file-size: 100MB
      total-size-cap: 1GB

discord:
  router-token: ${DISCORD_ROUTER_TOKEN:}
  sekai-channel-id: ${SEKAI_CHANNEL_ID:}
  character-tokens:
    AIRI: ${DISCORD_AIRI_TOKEN:}
    EMU: ${DISCORD_EMU_TOKEN:}
    HARUKA: ${DISCORD_HARUKA_TOKEN:}
    MIKU: ${DISCORD_MIKU_TOKEN:}
    MINORI: ${DISCORD_MINORI_TOKEN:}
    NENE: ${DISCORD_NENE_TOKEN:}
    SHIZUKU: ${DISCORD_SHIZUKU_TOKEN:}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:5000}

persona:
  dir: ${PERSONA_DIR:/home/maitmus/.openclaw/workspace/identities}
  watch-interval-ms: 60000

heartbeat:
  enabled: ${HEARTBEAT_ENABLED:true}
  quiet-start-hour: ${HEARTBEAT_QUIET_START_HOUR:21}
  quiet-end-hour: ${HEARTBEAT_QUIET_END_HOUR:10}
  dialogue-probability: ${HEARTBEAT_DIALOGUE_PROB:0.5}

# 매일 아침 날씨 발화 — 09:30 KST 발화 → 1h 캐시가 첫 하트비트(~10:29 직전)까지 살아 있어 cross-call hit
daily-weather:
  enabled: ${DAILY_WEATHER_ENABLED:true}
  cron: ${DAILY_WEATHER_CRON:0 30 9 * * *}
  location: ${DAILY_WEATHER_LOCATION:부산 중앙동}

# 머슴 자동 글/댓글 작성 — Phase 4-Lite
mersoom:
  enabled: ${MERSOOM_ENABLED:false}                      # 기본 false (마이그 검증 후 true)
  post-cron: ${MERSOOM_POST_CRON:0 30 11,18 * * *}       # 11:30, 18:30 KST
  comment-cron: ${MERSOOM_COMMENT_CRON:0 15 10-20/2 * * *}  # 10:15, 12:15, 14:15, 16:15, 18:15, 20:15
  skills-sync-cron: ${MERSOOM_SKILLS_CRON:0 0 9 * * *}   # 매일 09:00 KST
  state-file: ${MERSOOM_STATE_FILE:/app/mersoom-state.json}
  skills-cache-path: ${MERSOOM_SKILLS_CACHE:/app/mersoom-flags/skills-cache.md}
  context-note-bytes-per-friend: 1024
  voted-post-ids-limit: 100
  pow-timeout-seconds: 30
  puzzle-timeout-seconds: 10
  api-rate-limit-sleep-ms: 1000
  api-base-url: https://mersoom.com/api
  skills-doc-url: https://www.mersoom.com/docs/skills.md
  auth:
    auth-id: ${MERSOOM_AUTH_ID:}
    password: ${MERSOOM_PASSWORD:}
